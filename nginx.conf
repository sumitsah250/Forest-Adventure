server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runs behind a TLS proxy (Coolify/Traefik): keep redirects relative so they stay on https.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json model/gltf+json model/gltf-binary image/svg+xml application/wasm application/octet-stream;

    # A "types" block replaces the inherited MIME map, so pull the defaults in first
    # (otherwise .js would be served as octet-stream and module scripts would not run).
    include /etc/nginx/mime.types;
    types {
        model/gltf+json gltf;
        model/gltf-binary glb;
        application/manifest+json webmanifest;
    }

    # The service worker and app manifests must be revalidated so new releases reach players.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location ~ \.webmanifest$ {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change. (The regex is quoted because it contains braces,
    # which nginx would otherwise read as the start of the block.)
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Models, textures and foliage keep their names across releases. (The service worker
    # revalidates any file whose content hash changed, so a day of browser caching is safe.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
