server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json model/gltf+json image/svg+xml application/wasm application/octet-stream;

    types {
        model/gltf+json gltf;
        application/octet-stream bin;
        application/wasm wasm;
    }

    # Vite's hashed bundles never change.
    location ~ ^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Models, textures and foliage keep their names across releases.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
